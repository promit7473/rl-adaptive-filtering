seed: 42
fs: 360            # MIT-BIH ECG native rate; train and eval at the same fs
episode_len: 2000
filter_order: 16
state_window: 16

env:
  mu_min: 0.005
  mu_max: 2.0
  leakage_min: 0.70
  reward_kind: log_mse   # softplus | log_mse | neg_abs
  no_reward_clip: true
  convergence_bonus: 0.15
  terminal_ss_weight: 0.5
  robust_alpha: 0.05
  robust_beta: 0.02
  state_window: 4
  snr_db_options: [0, 5, 10, 15, 20]
  curriculum_weights:
    gaussian: 1.0
    colored: 1.0
    impulsive: 2.0
    time_varying: 2.0
    regime_switch: 3.0

rl:
  meta:
    total_timesteps: 1500000
    n_envs: 8
    learning_rate: 3.0e-4
    n_steps: 2048
    batch_size: 256
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.005
    lstm_hidden: 256
    n_lstm_layers: 2
    n_seeds: 5
  mlp:
    total_timesteps: 800000
    n_envs: 8
    learning_rate: 3.0e-4
    n_steps: 2048
    batch_size: 256
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.005
    hidden_size: 128
    n_seeds: 5

eval:
  seeds: [0, 1, 2, 3, 4]
  snr_db_values: [0, 5, 10, 15, 20]
  ecg_records: ["100", "101", "103", "105", "115"]
  ecg_noises: [powerline, gaussian, impulsive, burst]
  ecg_snrs: [0, 5, 10]

paths:
  results_dir: results
